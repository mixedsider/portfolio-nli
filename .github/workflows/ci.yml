name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate catalog, JavaScript and JSON fixtures
        run: |
          mkdir -p test-results/check
          pnpm test:check 2>&1 | tee test-results/check/check.log
      - name: Upload static check log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/check/
            playwright-report/
            coverage/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  node-unit:
    name: Node unit
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Run Node unit tests
        run: node tools/test-harness.mjs run --level unit --runner node --out-dir test-results/node-unit
      - name: Upload Node unit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-node-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/node-unit/
            playwright-report/
            coverage/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  node-integration:
    name: Node integration
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Run Node integration tests
        run: node tools/test-harness.mjs run --level integration --runner node --out-dir test-results/node-integration
      - name: Upload Node integration reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-node-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/node-integration/
            playwright-report/
            coverage/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  browser:
    name: Browser integration and E2E
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Install matching Chromium and hosted OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser integration and E2E tests
        run: node tools/test-harness.mjs run --runner playwright --out-dir test-results/browser
      - name: Upload browser reports and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/browser/
            playwright-report/
            coverage/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  verify:
    name: Verify portfolio
    if: ${{ always() }}
    needs: [check, node-unit, node-integration, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane to succeed
        shell: bash
        env:
          CHECK: ${{ needs['check'].result }}
          NODE_UNIT: ${{ needs['node-unit'].result }}
          NODE_INTEGRATION: ${{ needs['node-integration'].result }}
          BROWSER: ${{ needs['browser'].result }}
        run: |
          for result in "$CHECK" "$NODE_UNIT" "$NODE_INTEGRATION" "$BROWSER"; do
            if [[ "$result" != success ]]; then
              printf 'Required CI lane did not succeed: %s\n' "$result" >&2
              exit 1
            fi
          done
